    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
              display: ['Montserrat', 'sans-serif'],

            }

    <style>
      /* Glossy Card Reflection & Hover Lift */
      .glossy-card {
        position: relative;
        overflow: hidden;
        transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .glossy-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.05) 100%);
        border-top-left-radius: inherit;
        border-top-right-radius: inherit;
        pointer-events: none;
      }
      .glossy-card:hover {
        transform: translateY(-5px) scale(1.015);
        box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.6), 0 0 25px 2px rgba(250, 204, 21, 0.2);
      }
      /* Yellow Brush Stroke */
      .brush-badge-yellow {
        background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
        clip-path: polygon(2% 8%, 98% 3%, 99% 92%, 1% 97%);
      }
      .brush-badge-blue {
        background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        clip-path: polygon(1% 5%, 99% 0%, 97% 95%, 3% 100%);
      }
    </style>
  </head>
  <body class="bg-[#050b18] text-slate-100 font-sans selection:bg-amber-400 selection:text-slate-950 min-h-screen">

      <div class="min-h-screen flex flex-col items-center justify-center bg-[#050b18] text-white">

        </div>
        <p class="font-display font-bold text-sm tracking-widest text-slate-400 uppercase animate-pulse">SP FAST SERVICES</p>
      </div>
    </div>

    <!-- Vite React Application -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
